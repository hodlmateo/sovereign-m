[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-m"
version = "0.1.0"
description = "A small public demo of a local-first personal agent stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ask-m = "sovereign_m.cli:console_main"
m-roundtable = "sovereign_m.roundtable.cli:main"
m-handoff = "sovereign_m.handoff.cli:main"
m-check = "sovereign_m.checker.cli:main"
m-runner = "sovereign_m.runner.cli:main"
m-bots = "sovereign_m.botspage.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"sovereign_m.roundtable" = ["prompts/*.md"]
"sovereign_m.botspage" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
